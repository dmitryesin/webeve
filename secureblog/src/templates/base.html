<html>
<head>
    <title>secureblog</title>
</head>
<body>
    <h1>secureblog</h1>
    <div>
        {% if login %}
        <a href="/">Blog</a>
        <form action="/logout" method="POST" style="display: inline;">
            <input name="acsrf" type="hidden" value="{{ session.get('acsrf') }}" />
            <button type="submit">Logout</button>
        </form>
        Login as {{login}}
        {% else %}
        <a href="/">Blog</a> <a href="login">Login</a> <a href="register">Register</a>
        {% endif %}
    </div>
    {% block body %}{% endblock %}
</body>
</html>
